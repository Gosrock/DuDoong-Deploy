# 80·443 서버가 같이 include 한다 (default.conf). 보안 헤더 + 앱별 경로
# 앱(Spring Security 등)이 같은 헤더를 보내면 중복되지 않게 숨기고 nginx 값 하나만 내보낸다
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
# 브라우저는 항상 HTTPS 로 받는다 (443 직접, 이관 기간에는 ALB 경유도)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 어드민 해외 IP 차단 (Deploy #58, $geo_block 은 nginx.conf). 접근 로그에는 geo_block=1 로 남는다
if ($geo_block = 1) {
    rewrite ^ /__geo_blocked last;
}
location = /__geo_blocked {
    internal;
    default_type "text/html; charset=utf-8";
    return 403 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두둥</title></head><body style="font-family:sans-serif;text-align:center;padding:64px 16px"><p>두둥 관리자 화면은 국내에서만 이용할 수 있습니다.</p><p style="color:#888">DuDoong admin is only available in South Korea.</p></body></html>';
}

# Next.js 13 이미지 최적화 경로는 원격 코드 실행 취약점이 있어 막는다. 티켓은 images.unoptimized 로 원본을 직접 쓴다 (Deploy #73)
location = /_next/image {
    return 404;
}

location /api {
    include /etc/nginx/proxy_headers.conf;
    proxy_pass http://localhost:8080;

    # 웹 소켓 지원을 위해 추가
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Referer $http_referer;
}

location /internal-api {
    include /etc/nginx/proxy_headers.conf;
    proxy_pass http://localhost:8080;
}

location /internal-admin/ {
    include /etc/nginx/proxy_headers.conf;
    proxy_pass http://localhost:3200/;
}

location /admin/ {
    include /etc/nginx/proxy_headers.conf;
    proxy_pass http://localhost:3100/;
}

location / {
    include /etc/nginx/proxy_headers.conf;
    proxy_pass http://localhost:3000;
}
