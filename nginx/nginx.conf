user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # 앞단 ALB 는 없앴다 (Deploy #37). 클라이언트가 nginx 에 바로 붙으므로 $remote_addr 가 곧 실제 클라이언트다.
    # X-Forwarded-For 는 믿지 않는다 (set_real_ip_from 없음 — Deploy #48).

    # X-Forwarded-Proto 는 서버 안(localhost)에서 온 것만 믿는다. 서버 안은 80 으로 와도 HTTPS 로 돌리지 않는다 (default.conf)
    geo $remote_addr $from_trusted_proxy {
        default        0;
        127.0.0.1/32   1;
        ::1/128        1;
    }
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default    $scheme;
        "1:https"  https;
    }

    # 국내 IP 만 받는다 (Deploy #58). 그 밖은 site.conf 에서 403 안내 페이지로 보낸다.
    #   서버 안·사설 대역: 배포 헬스체크(localhost), 운영 → 스테이징 헬스체크(VPC 사설 IP)
    #   allow-kr.conf: APNIC KR 할당분 + AWS 서울 EC2 대역(EIP·Fargate 배치) — scripts/gen-geo-kr.py 가 만든다
    #   allow-extra.conf: 수동 예외 (해외 출장 관리자 등)
    geo $remote_addr $geo_allowed {
        default         0;
        127.0.0.0/8     1;
        ::1/128         1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        include /etc/nginx/geo/allow-kr.conf;
        include /etc/nginx/geo/allow-extra.conf;
    }

    # 쿼리스트링에 토큰이 실려 오므로 로그에는 경로까지만 남긴다 (요청 줄·Referer 모두)
    map $http_referer $referer_path {
        default         "";
        "~^([^?#]*)"    $1;
    }
    # 요청 경로는 원래 요청 줄에서 뗀다 ($uri 는 해외 차단 rewrite 뒤 /__geo_blocked 로 바뀐다)
    map $request_uri $request_path {
        default         "";
        "~^([^?#]*)"    $1;
    }

    log_format  trace  '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent "$referer_path" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'trace=$request_id geo=$geo_allowed';

    access_log  /var/log/nginx/access.log  trace;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
