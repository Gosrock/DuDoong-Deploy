user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # 앞단 ALB 는 없앴다 (Deploy #37). 클라이언트가 nginx 에 바로 붙으므로 $remote_addr 가 곧 실제 클라이언트다.
    # X-Forwarded-For 는 믿지 않는다 (set_real_ip_from 없음 — Deploy #48).

    # X-Forwarded-Proto 는 서버 안(localhost)에서 온 것만 믿는다. 서버 안은 80 으로 와도 HTTPS 로 돌리지 않는다 (default.conf)
    geo $remote_addr $from_trusted_proxy {
        default        0;
        127.0.0.1/32   1;
        ::1/128        1;
    }
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default    $scheme;
        "1:https"  https;
    }

    # 쿼리스트링에 토큰이 실려 오므로 로그에는 경로까지만 남긴다 (요청 줄·Referer 모두)
    map $http_referer $referer_path {
        default         "";
        "~^([^?#]*)"    $1;
    }

    log_format  trace  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$referer_path" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'trace=$request_id';

    access_log  /var/log/nginx/access.log  trace;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
