user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # 앞단 ALB 는 default VPC 안에 있다. ALB 가 붙인 X-Forwarded-For 의 맨 오른쪽(실제 클라이언트)을 $remote_addr 로 쓴다.
    # ALB 를 거치지 않고 서버로 바로 온 요청은 X-Forwarded-For 를 믿지 않는다.
    set_real_ip_from  172.31.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # X-Forwarded-Proto 도 ALB 가 보낸 것만 믿는다. 서버 안(localhost)은 80 으로 와도 HTTPS 로 돌리지 않는다 (default.conf)
    geo $realip_remote_addr $from_trusted_proxy {
        default        0;
        172.31.0.0/16  1;
        127.0.0.1/32   1;
    }
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default    $scheme;
        "1:https"  https;
    }

    # 쿼리스트링에 토큰이 실려 오므로 로그에는 경로까지만 남긴다 (요청 줄·Referer 모두)
    map $http_referer $referer_path {
        default         "";
        "~^([^?#]*)"    $1;
    }

    log_format  trace  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$referer_path" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'trace=$request_id';

    access_log  /var/log/nginx/access.log  trace;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
