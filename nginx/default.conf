# HTTPS 는 nginx 가 직접 처리한다 (Deploy #37, WorkBook EP09 5단계 — ALB 제거).
# 인증서: 서버의 ~/tls/certs → /etc/nginx/certs (scripts/tls-cert.sh 가 Let's Encrypt 로 발급·갱신)

# 80: 밖에서 바로 온 HTTP 는 HTTPS 로 보낸다.
#     ALB 경유(이관 기간, ALB 가 HTTPS 를 풀어서 80 으로 보낸다)와 서버 안(localhost — 배포 헬스체크)은 그대로 처리한다.
server {
    listen 80 default_server;
    server_name _;

    if ($from_trusted_proxy = 0) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/site.conf;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/site.conf;
}
