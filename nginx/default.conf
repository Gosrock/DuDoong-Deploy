# HTTPS 는 nginx 가 직접 처리한다 (Deploy #37, WorkBook EP09 5단계 — ALB 제거).
# 인증서: 서버의 ~/tls/certs → /etc/nginx/certs (scripts/tls-cert.sh 가 Let's Encrypt 로 발급·갱신)
#
# 받는 Host 는 실제 도메인과 localhost 뿐이다 (Deploy #48). 운영·스테이징이 같은 이미지를 쓰므로 양쪽 도메인을 다 둔다.
# 그 밖의 Host(IP 직접 접속·스캐너·남의 도메인)는 기본 서버가 끊는다.

# 80 기본 서버: 모르는 Host.
#   예외 — 운영 백엔드가 스테이징을 사설 IP:80 으로 헬스체크한다 (Backend StagingAppHealthChecker, 200 만 정상으로 본다).
#   그 경로 하나만 처리하고 나머지는 응답 없이 끊는다.
server {
    listen 80 default_server;
    server_name _;

    location = /api/v1/examples/health {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://localhost:8080;
    }

    location / {
        return 444;
    }
}

# 80 실제 도메인: 밖에서 온 HTTP 는 HTTPS 로 보낸다.
#   서버 안(localhost — 배포 헬스체크 curl http://localhost/api/v1/examples/health)은 그대로 처리한다.
server {
    listen 80;
    server_name dudoong.com internal-admin.dudoong.com
                staging.dudoong.com staging-internal-admin.dudoong.com
                localhost;

    if ($from_trusted_proxy = 0) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/site.conf;
}

# 443 기본 서버: 모르는 SNI(또는 SNI 없음)는 TLS 핸드셰이크를 거절한다 (인증서도 내보내지 않는다)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
# (실제 도메인 SNI 로 핸드셰이크하고 Host 만 다른 값으로 보내면 nginx 가 421 로 거절한다)

server {
    listen 443 ssl;
    http2 on;
    server_name dudoong.com internal-admin.dudoong.com
                staging.dudoong.com staging-internal-admin.dudoong.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/site.conf;
}
