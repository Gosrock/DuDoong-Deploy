name: Deployment
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 인프라(CloudFormation)·배치 워크플로만 바뀐 머지로는 앱을 다시 배포하지 않는다
    paths-ignore:
      - infra/**
      - .github/workflows/batch-*.yml
      - .github/workflows/infra-*.yml
      - .github/workflows/staging-power.yml
      - .github/workflows/tls-check.yml

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS 역할 (스테이징 상태 조회, SSM 배포)

# GitHub 에는 리포지토리 secret AWS_ACCOUNT_ID 하나만 둔다. 나머지 값은 AWS SSM (Deploy #28)
#  - 스테이징 인스턴스 ID: SSM /dudoong/infra/staging-instance-id (워크플로 역할로 읽음)
#  - 앱 .env: 서버가 자기 인스턴스 역할로 SSM /dudoong/env/<prod|staging> 을 직접 읽음 (scripts/fetch-env.sh)

jobs:
  deploy-staging:
    name: Staging
    # 스테이징이 꺼져 있으면 안에서 건너뛰고 성공으로 끝난다 → 운영 배포는 그대로 진행
    uses: ./.github/workflows/staging-deploy.yml
    secrets: inherit

  deploy-production:
    name: Deploy(Production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: DuDoong-Production
    # deploy-live 와 같은 그룹: 운영 서버 배포는 한 번에 하나 (스테이징 대기와는 무관)
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # SSH 대신 SSM Run Command (Deploy #50). 이 역할은 DuDoong-Production(승인자 + main 만) job 만 맡는다
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-prod-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: deploy via SSM
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name /dudoong/infra/prod-instance-id --query Parameter.Value --output text)
          echo "::add-mask::$INSTANCE_ID"
          bash scripts/ssm-deploy.sh "$INSTANCE_ID" prod "$GITHUB_SHA"
