name: Deployment
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 인프라(CloudFormation)·배치 워크플로만 바뀐 머지로는 앱을 다시 배포하지 않는다
    paths-ignore:
      - infra/**
      - .github/workflows/batch-*.yml
      - .github/workflows/infra-*.yml
      - .github/workflows/staging-power.yml
      - .github/workflows/tls-check.yml

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS 역할 (스테이징 상태 조회)

# GitHub 에는 리포지토리 secret AWS_ACCOUNT_ID 하나만 둔다. 나머지 값은 AWS SSM (Deploy #28)
#  - 스테이징 인스턴스 ID: SSM /dudoong/infra/staging-instance-id (워크플로 역할로 읽음)
#  - 앱 .env: 서버가 자기 인스턴스 역할로 SSM /dudoong/env/<prod|staging> 을 직접 읽음 (scripts/fetch-env.sh)

jobs:
  deploy-staging:
    name: Staging
    # 스테이징이 꺼져 있으면 안에서 건너뛰고 성공으로 끝난다 → 운영 배포는 그대로 진행
    uses: ./.github/workflows/staging-deploy.yml
    secrets: inherit

  deploy-production:
    name: Deploy(Production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: DuDoong-Production
    # deploy-live 와 같은 그룹: 운영 서버 배포는 한 번에 하나 (스테이징 대기와는 무관)
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: create remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: mkdir -p ~/srv/ubuntu

      # Docker Hub 를 거치지 않게 러너에 있는 rsync·ssh 를 직접 쓴다
      # (burnett01/rsync-deployments 는 실행마다 Docker Hub 이미지를 받아 429 로 실패했다 — Deploy #41)
      - name: copy source via ssh key
        env:
          SSH_KEY: ${{ secrets.KEY }}
          TARGET_HOST: ${{ secrets.HOST }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          rsync -azr --delete \
            -e "ssh -i $RUNNER_TEMP/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" \
            ./ "ubuntu@$TARGET_HOST:~/srv/ubuntu/"
          rm -f "$RUNNER_TEMP/deploy_key"
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs:
          script: |
            sh ~/srv/ubuntu/docker-install.sh
            sh ~/srv/ubuntu/scripts/fetch-env.sh prod || exit 1
            sh ~/srv/ubuntu/scripts/tls-cert.sh prod || exit 1
            echo "start docker-compose up: ubuntu"
            sudo docker-compose -v
            sudo docker-compose -f ~/srv/ubuntu/docker-compose.prod.yml pull
            sudo docker-compose -f ~/srv/ubuntu/docker-compose.prod.yml --env-file ~/srv/ubuntu/.env up --build -d
            echo "prune images"
            sudo docker system prune --all -f
