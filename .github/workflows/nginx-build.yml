name: Build & Push (ECR) - Nginx
# 이미지는 ECR 비공개 저장소 dudoong-nginx 에만 올린다 (Deploy #59). 같은 버전 태그는 다시 올릴 수 없다
on:
  push:
    tags:
      - Nginx-v*.*.*

permissions:
  contents: read
  id-token: write # GitHub OIDC → ECR push 역할 (Nginx-v* 태그 job 만 맡을 수 있다)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: |
          RELEASE_VERSION_WITHOUT_V="$(cut -d'v' -f2 <<< ${GITHUB_REF#refs/*/})"
          echo "VERSION=$RELEASE_VERSION_WITHOUT_V" >> $GITHUB_OUTPUT

      # 운영·스테이징 t4g(ARM) 전환 (Deploy #41) — amd64 + arm64 멀티 아키
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-ecr-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: login to ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dudoong-nginx:${{ steps.get_version.outputs.VERSION }}
