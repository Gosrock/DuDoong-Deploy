name: Infra Deploy (batch)
# GitOps: infra/batch.yml 을 바꾸는 PR 에서는 변경 내용(변경 세트)만 보여 주고, main 머지 때 반영한다
on:
  pull_request:
    paths:
      - infra/batch.yml
  push:
    branches:
      - main
    paths:
      - infra/batch.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-batch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub 에는 secret AWS_ACCOUNT_ID 하나만. 스택 값은 AWS SSM(/dudoong/infra/*)에서 템플릿이 직접 읽는다 (Deploy #28)
    # PR 은 미리보기 전용 역할(실행 권한 없음), main 은 반영 역할 — 역할 신뢰 정책이 브랜치·PR 로 구분한다
    env:
      HAS_ROLE: ${{ secrets.AWS_ACCOUNT_ID != '' }}
      ROLE_NAME: ${{ github.event_name == 'pull_request' && 'dudoong-github-batch-preview' || 'dudoong-github-batch' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # AWS 설정(스택 dudoong-github-batch-role + Environment 변수) 전에는 건너뛴다
      - name: check setup
        if: ${{ env.HAS_ROLE != 'true' }}
        run: echo "::notice::secret AWS_ACCOUNT_ID 가 없어 건너뜀 (infra/SETUP.md 참고)"

      - name: configure aws credentials
        if: ${{ env.HAS_ROLE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      # 스택 파라미터는 Environment 변수에 둔다 (퍼블릭 리포라 리소스 ID 를 파일에 쓰지 않음)
      - name: deploy stack
        if: ${{ env.HAS_ROLE == 'true' }}
        # 실패하면 로그 마지막 몇 줄만 계정 ID 를 가려 보여 준다
        shell: bash
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'apply' }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          extra=""
          [ "$MODE" = "preview" ] && extra="--no-execute-changeset"
          aws cloudformation deploy \
            --stack-name dudoong-batch \
            --template-file infra/batch.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$ACCOUNT_ID:role/dudoong-cfn-exec-batch" \
            --no-fail-on-empty-changeset $extra \
            > deploy.log 2>&1 \
            || { tail -5 deploy.log | sed -E 's/[0-9]{12}/***/g'; exit 1; }
          echo "반영 완료 ($MODE)"

      - name: change set summary
        if: ${{ github.event_name == 'pull_request' && env.HAS_ROLE == 'true' }}
        shell: bash
        run: |
          cs=$(grep -oE 'arn:aws:cloudformation:[^ ]+changeSet/[^ ]+' deploy.log | head -1 || true)
          {
            echo "### dudoong-batch 변경 세트 (반영 전 미리보기)"
            if [ -z "$cs" ]; then
              echo "변경 없음"
            else
              echo '| 동작 | 리소스 | 타입 | 교체 |'
              echo '|---|---|---|---|'
              aws cloudformation describe-change-set --change-set-name "$cs" \
                --query 'Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement]' --output text \
                | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
              aws cloudformation delete-change-set --change-set-name "$cs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
