name: Infra Deploy (batch)
# GitOps: infra/batch.yml 을 바꾸는 PR 에서는 변경 내용(변경 세트)만 보여 주고, main 머지 때 승인을 받아 반영한다.
# GitHub 에는 secret AWS_ACCOUNT_ID 하나만. 스택 값은 AWS SSM(/dudoong/infra/*, /dudoong/env/batch)에서 템플릿이 읽는다 (Deploy #28)
# SSM 값만 바꿨을 때는 이 워크플로를 수동 실행(Run workflow)해 반영한다.
on:
  pull_request:
    paths:
      - infra/batch.yml
  push:
    branches:
      - main
    paths:
      - infra/batch.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-batch
  cancel-in-progress: false

env:
  # SSM 파라미터 이름을 항상 명시한다 (기존 스택 갱신 때 이전 값이 이름 대신 들어가지 않게)
  SSM_PARAMS: >-
    VpcId=/dudoong/infra/vpc-id
    SubnetIds=/dudoong/infra/batch-subnet-ids
    RdsSecurityGroupId=/dudoong/infra/rds-sg-id
    BatchImageTag=/dudoong/infra/batch-image-tag
    SchedulesState=/dudoong/infra/batch-schedules-state
    AlertEmail=/dudoong/infra/alert-email
  # 실패 로그를 보여 줄 때 가리는 값 (퍼블릭 리포): 계정 ID, 보안 그룹·서브넷·VPC ID, 이메일 (Deploy #48)
  MASK_SED: 's/[0-9]{12}/***/g; s/(sg|subnet|vpc)-[0-9a-f]{8,17}/\1-***/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'

jobs:
  # PR: 미리보기 전용 역할 (변경 세트를 만들고 보고 지울 수만 있다, 실행 권한 없음)
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      HAS_ROLE: ${{ secrets.AWS_ACCOUNT_ID != '' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check setup
        if: ${{ env.HAS_ROLE != 'true' }}
        run: echo "::notice::secret AWS_ACCOUNT_ID 가 없어 건너뜀 (infra/SETUP.md 참고)"

      - name: configure aws credentials
        if: ${{ env.HAS_ROLE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-batch-preview
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: create change set (no execute)
        if: ${{ env.HAS_ROLE == 'true' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2086
          aws cloudformation deploy \
            --stack-name dudoong-batch \
            --template-file infra/batch.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$ACCOUNT_ID:role/dudoong-cfn-exec-batch" \
            --no-fail-on-empty-changeset --no-execute-changeset \
            --parameter-overrides $SSM_PARAMS \
            > deploy.log 2>&1 \
            || { tail -5 deploy.log | sed -E "$MASK_SED"; exit 1; }

      - name: change set summary
        if: ${{ env.HAS_ROLE == 'true' }}
        shell: bash
        run: |
          cs=$(grep -oE 'arn:aws:cloudformation:[^ ]+changeSet/[^ ]+' deploy.log | head -1 || true)
          {
            echo "### dudoong-batch 변경 세트 (반영 전 미리보기)"
            if [ -z "$cs" ]; then
              echo "변경 없음"
            else
              echo '| 동작 | 리소스 | 타입 | 교체 |'
              echo '|---|---|---|---|'
              aws cloudformation describe-change-set --change-set-name "$cs" \
                --query 'Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement]' --output text \
                | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
              aws cloudformation delete-change-set --change-set-name "$cs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # main 머지·수동 실행: 반영 역할. DuDoong-Infra Environment 승인자가 승인해야 시작한다
  apply:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: DuDoong-Infra
    env:
      HAS_ROLE: ${{ secrets.AWS_ACCOUNT_ID != '' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check setup
        if: ${{ env.HAS_ROLE != 'true' }}
        run: echo "::notice::secret AWS_ACCOUNT_ID 가 없어 건너뜀 (infra/SETUP.md 참고)"

      - name: configure aws credentials
        if: ${{ env.HAS_ROLE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-batch
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: deploy stack
        if: ${{ env.HAS_ROLE == 'true' }}
        # 실패하면 로그 마지막 몇 줄만 계정 ID·리소스 ID·이메일을 가려 보여 준다 (MASK_SED)
        shell: bash
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # shellcheck disable=SC2086
          aws cloudformation deploy \
            --stack-name dudoong-batch \
            --template-file infra/batch.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "arn:aws:iam::$ACCOUNT_ID:role/dudoong-cfn-exec-batch" \
            --no-fail-on-empty-changeset \
            --parameter-overrides $SSM_PARAMS \
            > deploy.log 2>&1 \
            || { tail -5 deploy.log | sed -E "$MASK_SED"; exit 1; }
          echo "반영 완료"
