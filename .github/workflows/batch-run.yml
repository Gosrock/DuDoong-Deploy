name: Batch Run (manual)
# Fargate 배치를 실행하고 끝날 때까지 기다린다 (Jenkins "Build with Parameters" 대체).
# 퍼블릭 리포라 배치 로그는 여기 찍지 않는다 → CloudWatch Logs /dudoong/batch
on:
  workflow_dispatch:
    inputs:
      job:
        description: 배치 job (정산_전체 = 정산 7개를 순서대로, 하나라도 실패하면 멈춤)
        required: true
        type: choice
        options:
          - 이벤트_자동만료
          - 슬랙유저통계
          - 정산_전체
          - 이벤트거래정산
          - 이벤트정산요약
          - 이벤트정산서
          - 이벤트주문목록_엑셀업로드
          - 이벤트정산_이메일발송_어드민
          - 이벤트정산_이메일발송_호스트
          - 이벤트정산_알림톡발송_호스트
      event_id:
        description: 정산 job의 공연 ID (eventId)
        required: false
        default: ""
      date:
        description: 슬랙유저통계 기준 날짜 yyyy-MM-dd (비우면 오늘, KST). 이미 성공한 날짜는 다시 돌지 않는다
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: batch-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # main 브랜치에서 실행할 때만 역할을 맡을 수 있다 (역할 신뢰 정책)
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-batch
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      # 실행할 배치 인자 목록 (한 줄 = 태스크 한 번). $RUN_ID·$TODAY 는 컨테이너 안에서 채워진다
      - name: build batch args
        env:
          JOB: ${{ inputs.job }}
          EVENT_ID: ${{ inputs.event_id }}
          DATE: ${{ inputs.date }}
        run: |
          settlement="이벤트거래정산 이벤트정산요약 이벤트정산서 이벤트주문목록_엑셀업로드 이벤트정산_이메일발송_어드민 이벤트정산_이메일발송_호스트 이벤트정산_알림톡발송_호스트"
          # grep 은 줄 단위라 여러 줄 입력의 한 줄만 맞아도 통과한다 → case 로 값 전체를 검사한다
          need_event_id() {
            case "$EVENT_ID" in ''|*[!0-9]*) echo "정산 job은 공연 ID(event_id, 숫자만)가 필요하다"; exit 1 ;; esac
          }
          : > runs.txt
          case "$JOB" in
            이벤트_자동만료) echo '--job.name=이벤트_자동만료 version=$RUN_ID' >> runs.txt ;;
            슬랙유저통계)
              if [ -n "$DATE" ]; then
                case "$DATE" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "날짜 형식은 yyyy-MM-dd"; exit 1 ;; esac
                echo "--job.name=슬랙유저통계 date=$DATE" >> runs.txt
              else
                echo '--job.name=슬랙유저통계 date=$TODAY' >> runs.txt
              fi ;;
            정산_전체)
              need_event_id
              for j in $settlement; do echo "--job.name=$j eventId=$EVENT_ID version=\$RUN_ID" >> runs.txt; done ;;
            *)
              echo " $settlement " | grep -q " $JOB " || { echo "알 수 없는 job: $JOB"; exit 1; }
              need_event_id
              echo "--job.name=$JOB eventId=$EVENT_ID version=\$RUN_ID" >> runs.txt ;;
          esac
          cat runs.txt

      - name: run tasks and wait
        run: |
          out() { aws cloudformation describe-stacks --stack-name dudoong-batch --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          cluster=$(out ClusterName); taskdef=$(out TaskDefinitionArn); sg=$(out TaskSecurityGroupId); subnets=$(out SubnetIds)
          echo "### 배치 실행 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '| job args | exit code | 로그 스트림 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r args; do
            [ -z "$args" ] && continue
            overrides=$(jq -nc --arg a "$args" '{containerOverrides:[{name:"app",environment:[{name:"BATCH_ARGS",value:$a}]}]}')
            task=$(aws ecs run-task --cluster "$cluster" --task-definition "$taskdef" --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$sg],assignPublicIp=ENABLED}" \
              --overrides "$overrides" --query 'tasks[0].taskArn' --output text)
            if [ -z "$task" ] || [ "$task" = "None" ]; then echo "태스크를 시작하지 못함: $args"; exit 1; fi
            id=${task##*/}
            echo "실행: $args (task $id)"
            # aws ecs wait 는 10분이면 포기한다. 정산·메일 job 은 더 걸릴 수 있어 직접 기다린다 (최대 55분)
            status=""
            for i in $(seq 1 330); do
              status=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].lastStatus' --output text)
              [ "$status" = "STOPPED" ] && break
              sleep 10
            done
            if [ "$status" != "STOPPED" ]; then
              echo "::error::55분이 지나도 끝나지 않음 (task $id, 상태 $status). 태스크는 아직 돌고 있을 수 있으니 **다시 실행하지 말고** CloudWatch Logs 와 배치 이력 화면에서 끝났는지 확인"
              echo "| \`$args\` | 확인 필요 (55분 초과, 재실행 금지) | \`batch/app/$id\` |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            code=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query "tasks[0].containers[?name=='app'].exitCode | [0]" --output text)
            reason=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].stoppedReason' --output text)
            echo "  exit code: $code / stopped: ${reason//[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]/***}"
            echo "| \`$args\` | \`$code\` | \`batch/app/$id\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "0" ]; then
              echo "::error::실패해서 멈춤 (로그: CloudWatch Logs /dudoong/batch). 정산_전체를 다시 돌리면 앞서 성공한 job(메일·알림톡 포함)도 다시 실행되니, 실패한 job부터 개별로 실행"
              exit 1
            fi
          done < runs.txt
