name: Staging Power
# 스테이징 서버 켜기·끄기·상태 확인 (WorkBook EP09). 평소에는 꺼 두고 필요할 때만 켠다.
# - 켜기: 서버를 켜고 Deployment 와 같은 단계(staging-deploy.yml)로 main 최신 버전을 배포·헬스체크한다
#         (Deployment 는 스테이징이 꺼져 있으면 건너뛰므로, 꺼져 있던 동안의 변경도 켤 때 반영된다)
# - 끄기: 매일 02:00(KST) 자동 종료와 같은 동작을 지금 바로 한다
# 역할은 배포와 같은 dudoong-github-staging-deploy (스테이징 인스턴스 한 대만 켜고 끌 수 있다)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 동작
        required: true
        type: choice
        options:
          - status
          - start
          - stop

permissions:
  contents: read
  id-token: write

jobs:
  power:
    runs-on: ubuntu-latest
    environment: DuDoong-Staging
    # 배포와 같은 그룹: 배포 중에는 켜기·끄기가 기다린다 (켜기 뒤 배포 job 은 이 job 이 끝난 다음 같은 그룹을 잡는다)
    concurrency:
      group: deploy-staging-server
      cancel-in-progress: false
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-staging-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name /dudoong/infra/staging-instance-id --query Parameter.Value --output text)
          echo "::add-mask::$INSTANCE_ID"
          state() { aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text; }
          s=$(state); echo "현재 상태: $s"
          case "$ACTION" in
            start)
              [ "$s" = stopping ] && aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              echo "서버 켜짐 → 이어서 최신 버전 배포 (deploy job)"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              ;;
          esac
          s=$(state); echo "최종 상태: $s"
          echo "### 스테이징: \`$s\`" >> "$GITHUB_STEP_SUMMARY"

  # 켜기: 배포 파이프라인과 같은 스테이징 배포 단계 (fetch-env·인증서·compose·헬스체크)
  deploy:
    needs: power
    if: ${{ inputs.action == 'start' }}
    uses: ./.github/workflows/staging-deploy.yml
    secrets: inherit
