name: Image Copy (Docker Hub → ECR)
# 운영 이미지를 ECR 비공개 저장소로 복사한다 (Deploy #59). 멀티 아키(amd64+arm64) 목록을 그대로 옮긴다.
# - 처음 이전: 비워 두고 실행하면 compose 두 파일이 쓰는 태그를 모두 복사
# - 과도기: 아직 Docker Hub 에만 올리는 리포(Front #344)의 새 버전을 배포 전에 복사
# 배치 이미지(dudoong-batch)는 batch-image.yml 이 따로 복사한다.
on:
  workflow_dispatch:
    inputs:
      images:
        description: '복사할 이미지 (공백 구분, 예: dudoong-ticket:1.3.2 dudoong-admin:dev). 비우면 compose 가 쓰는 태그 전부'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-image-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    # 승인자가 승인해야 시작한다. 역할(dudoong-github-ecr-deploy)도 이 Environment job 만 맡는다
    environment: DuDoong-Infra
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-ecr-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: login to ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: copy images
        env:
          IMAGES: ${{ inputs.images }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # ECR 저장소 → Docker Hub 원본
          declare -A SRC=(
            [dudoong-api]=water0641/dudoong-api
            [dudoong-nginx]=water0641/dudoong-nginx
            [dudoong-internal-admin]=water0641/dudoong-internal-admin
            [dudoong-ticket]=david0218/dudoong-ticket
            [dudoong-admin]=david0218/dudoong-admin
          )
          if [ -z "$IMAGES" ]; then
            IMAGES=$(grep -hoE 'dudoong-[a-z-]+:[A-Za-z0-9._-]+' docker-compose.prod.yml docker-compose.staging.yml | sort -u)
          fi
          for ref in $IMAGES; do
            if ! [[ "$ref" =~ ^(dudoong-[a-z-]+):([A-Za-z0-9._-]{1,128})$ ]]; then
              echo "잘못된 이미지: $ref (예: dudoong-api:2.3.3)"; exit 1
            fi
            repo="${BASH_REMATCH[1]}"; tag="${BASH_REMATCH[2]}"
            src="${SRC[$repo]:-}"
            [ -n "$src" ] || { echo "모르는 저장소: $repo"; exit 1; }
            # 버전 태그는 덮어쓸 수 없는 저장소라 이미 있으면 건너뛴다. dev 는 매번 새로 덮어쓴다
            if [ "$tag" != dev ] && aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$tag" > /dev/null 2>&1; then
              echo "이미 있음: $repo:$tag"; continue
            fi
            # 공급망 확인용: 원본 digest 를 남긴다 (ECR 은 푸시 때 취약점 스캔)
            echo "$src:$tag → $repo:$tag ($(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$src:$tag"))"
            docker buildx imagetools create --tag "$REGISTRY/$repo:$tag" "$src:$tag" > /dev/null
            echo "복사 완료: $repo:$tag"
          done
