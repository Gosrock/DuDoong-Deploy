name: Deployment-live
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS 역할 (SSM 배포)

jobs:
  deploy-production:
    name: Deploy(Production)
    runs-on: ubuntu-latest
    environment: DuDoong-Production
    # deploy.yml 의 운영 job 과 같은 그룹 → 운영 서버 배포가 겹치지 않는다. 스테이징 대기는 기다리지 않는다
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # SSH 대신 SSM Run Command (Deploy #50). 이 역할은 DuDoong-Production(승인자 + main 만) job 만 맡는다
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dudoong-github-prod-deploy
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: deploy via SSM
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name /dudoong/infra/prod-instance-id --query Parameter.Value --output text)
          echo "::add-mask::$INSTANCE_ID"
          bash scripts/ssm-deploy.sh "$INSTANCE_ID" prod "$GITHUB_SHA"
