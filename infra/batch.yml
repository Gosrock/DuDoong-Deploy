AWSTemplateFormatVersion: "2010-09-09"
Description: >
  두둥 배치를 센터(Jenkins) 대신 ECS Fargate 예약 작업으로 실행한다 (WorkBook EP09 4단계, Deploy #25).
  실행할 때만 과금된다. 배치는 시작할 때 Redis 연결이 필요해 같은 태스크에 Redis 사이드카를 둔다.

# 배포: Actions "Infra Deploy (batch)" (main 머지 시 자동). 값은 모두 SSM 에서 읽는다 (파라미터 없음):
#   /dudoong/infra/vpc-id, batch-subnet-ids, rds-sg-id, alert-email, batch-schedules-state, batch-image-tag
#   /dudoong/env/batch (SecureString — 센터 .env.prod)
# 값을 바꾸려면 AWS 콘솔(Systems Manager → Parameter Store)에서 바꾸고 "Infra Deploy (batch)" 를 다시 실행한다.

Parameters:
  VpcId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/vpc-id
  SubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /dudoong/infra/batch-subnet-ids
    Description: 퍼블릭 서브넷 (NAT 없음 → 태스크에 퍼블릭 IP를 붙여 ECR·Slack 등에 나간다)
  RdsSecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/rds-sg-id
    Description: RDS 보안그룹. 배치 보안그룹에서 3306 접속을 허용하는 규칙을 이 스택이 추가한다
  BatchImageTag:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/batch-image-tag
    Description: ECR dudoong-batch 이미지 태그 (처음엔 Jenkins와 같은 1.0.5-1)
  SchedulesState:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/batch-schedules-state
    Description: 예약 실행 ENABLED/DISABLED. 수동 실행으로 확인한 뒤 Jenkins 작업을 끄고 ENABLED 로 바꾼다
  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/alert-email
    Description: 배치 실패 알림 받을 이메일

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-batch
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"태그 없는 이미지만 정리 (쓰는 태그는 지우지 않는다)","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dudoong-batch
      # CapacityProviders 는 두지 않는다: RunTask 가 LaunchType FARGATE 를 쓰고,
      # ECS 를 처음 쓰는 계정에서 서비스 연결 역할 전파 전에 붙이면 생성이 실패할 수 있다

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dudoong/batch
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-batch-execution
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/dudoong-batch-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-batch-env
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ECS 가 태스크를 시작할 때 SSM 의 배치 .env 를 컨테이너에 넣는다
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dudoong/env/batch
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dudoong batch fargate tasks (outbound only)
      VpcId: !Ref VpcId
      # 인바운드 없음. 아웃바운드는 보안그룹 기본값(전체 허용)

  RdsIngressFromBatch:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: dudoong batch fargate

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dudoong-batch
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dudoong-batch:${BatchImageTag}
          Essential: true
          # 이미지 원래 ENTRYPOINT 와 같은 java 옵션. 실행마다 BATCH_ARGS 만 바꾼다.
          # 1) DOTENV(SSM /dudoong/env/batch, .env 내용 통째로)를 한 줄씩 읽어 export 한다.
          #    docker --env-file 과 같은 규칙: KEY=VALUE, '#' 주석·빈 줄·'=' 없는 줄 무시, 앞 공백·CRLF 의 \r 제거,
          #    값은 해석하지 않고 그대로. 셸 변수 이름이 될 수 없는 키(점·대시 포함)는 건너뛴다.
          # 2) Redis 는 같은 태스크의 사이드카(비밀번호 없음)로 덮어쓴다.
          # 3) BATCH_ARGS 안의 자리표시자 $TODAY(KST yyyy-MM-dd), $RUN_ID(epoch 초)만 글자 그대로 바꾸고
          #    셸로 해석(eval)하지 않는다 → 인자에 명령이 섞여도 실행되지 않는다.
          # 이미지에 시간대 파일이 없어 POSIX 표기 KST-9 를 쓴다
          EntryPoint: ["sh", "-c"]
          Command:
            - 'set -f; printf "%s\n" "$DOTENV" > /tmp/.env; unset DOTENV; cr=$(printf "\r"); while IFS= read -r line || [ -n "$line" ]; do line=${line%"$cr"}; line=${line#"${line%%[![:space:]]*}"}; case "$line" in ""|"#"*) continue ;; *=*) ;; *) continue ;; esac; key=${line%%=*}; case "$key" in ""|*[!A-Za-z0-9_]*) continue ;; esac; export "$key=${line#*=}"; done < /tmp/.env; rm -f /tmp/.env; export REDIS_HOST=localhost REDIS_PORT=6379; unset REDIS_PASSWORD; TODAY=$(TZ=KST-9 date +%F); RUN_ID=$(date +%s); set -- $(printf "%s" "$BATCH_ARGS" | sed -e "s/\$TODAY/$TODAY/g" -e "s/\$RUN_ID/$RUN_ID/g"); exec java -Dspring.profiles.active="$PROFILE" -Djava.security.egd=file:/dev/./urandom -Duser.timezone=Asia/Seoul -jar /app.jar "$@"'
          Secrets:
            - Name: DOTENV
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dudoong/env/batch
          Environment:
            - Name: BATCH_ARGS
              Value: ""
          DependsOn:
            - ContainerName: redis
              Condition: HEALTHY
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: batch
        - Name: redis
          Image: public.ecr.aws/docker/library/redis:7-alpine
          Essential: false
          HealthCheck:
            Command: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            Interval: 5
            Timeout: 3
            Retries: 5
            StartPeriod: 5
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: redis

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-batch-scheduler
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/dudoong-batch-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: run-batch-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/dudoong-batch:*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dudoong-batch-scheduler-dlq
      MessageRetentionPeriod: 1209600

  # Jenkins "이벤트_만료처리" (H/30 19-22) 대체
  EventExpirationSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dudoong-batch-event-expiration
      Description: 이벤트_자동만료 — 19~22시 30분마다 (KST)
      ScheduleExpression: cron(0,30 19-22 * * ? *)
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow:
        Mode: "OFF"
      State: !Ref SchedulesState
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ecs:runTask
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
        # 스케줄러가 태스크를 시작조차 못 하면(권한·서브넷·용량) 여기로 → 알람
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn
        Input: !Sub
          - >-
            {"Cluster":"${Cluster}","TaskDefinition":"${TaskDefinition}","LaunchType":"FARGATE",
            "NetworkConfiguration":{"AwsvpcConfiguration":{"Subnets":["${Subnets}"],"SecurityGroups":["${TaskSecurityGroup}"],"AssignPublicIp":"ENABLED"}},
            "Overrides":{"ContainerOverrides":[{"Name":"app","Environment":[{"Name":"BATCH_ARGS","Value":"--job.name=이벤트_자동만료 version=$RUN_ID"}]}]}}
          - Subnets: !Join ['","', !Ref SubnetIds]

  # Jenkins "유저일일통계정보-prod" (30 21 * * *) 대체
  UserStatisticSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dudoong-batch-user-statistic
      Description: 슬랙유저통계 — 매일 21:30 (KST)
      ScheduleExpression: cron(30 21 * * ? *)
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow:
        Mode: "OFF"
      State: !Ref SchedulesState
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ecs:runTask
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
        # 스케줄러가 태스크를 시작조차 못 하면(권한·서브넷·용량) 여기로 → 알람
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn
        Input: !Sub
          - >-
            {"Cluster":"${Cluster}","TaskDefinition":"${TaskDefinition}","LaunchType":"FARGATE",
            "NetworkConfiguration":{"AwsvpcConfiguration":{"Subnets":["${Subnets}"],"SecurityGroups":["${TaskSecurityGroup}"],"AssignPublicIp":"ENABLED"}},
            "Overrides":{"ContainerOverrides":[{"Name":"app","Environment":[{"Name":"BATCH_ARGS","Value":"--job.name=슬랙유저통계 date=$TODAY"}]}]}}
          - Subnets: !Join ['","', !Ref SubnetIds]

  # 배치 컨테이너(app)가 0이 아닌 코드로 끝나면 알림
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dudoong-batch-alert

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBatchFailureRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt FailedTaskRule.Arn
                  - !GetAtt TaskFailedToStartRule.Arn
          - Sid: AllowDlqAlarm
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  FailedTaskRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dudoong-batch-failed
      Description: dudoong-batch 태스크의 app 컨테이너가 비정상 종료
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          containers:
            name: [app]
            exitCode: [{ "anything-but": 0 }]
      Targets:
        - Id: sns
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              group: $.detail.group
              reason: $.detail.stoppedReason
              task: $.detail.taskArn
            InputTemplate: '"[두둥 배치 실패] <group> / <reason> / <task>"'

  # 컨테이너가 시작조차 못 한 경우(이미지 pull 실패, env 파일 없음 등) — exitCode 가 없어 위 룰에 안 걸린다
  TaskFailedToStartRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dudoong-batch-failed-to-start
      Description: dudoong-batch 태스크가 시작하지 못함
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          stopCode: [TaskFailedToStart]
      Targets:
        - Id: sns
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              group: $.detail.group
              reason: $.detail.stoppedReason
            InputTemplate: '"[두둥 배치 시작 실패] <group> / <reason>"'

  SchedulerDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dudoong-batch-scheduler-failed
      AlarmDescription: 스케줄러가 배치 태스크를 시작하지 못함 (DLQ 에 메시지)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SchedulerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  SubnetIds:
    Value: !Join [",", !Ref SubnetIds]
