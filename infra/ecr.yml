AWSTemplateFormatVersion: "2010-09-09"
Description: >
  운영 이미지 비공개 저장소 (Deploy #59). Docker Hub 공개 이미지를 ECR 로 옮긴다.
  - 저장소 5개: 버전 태그는 덮어쓰기 불가, 스테이징용 dev 태그만 예외. 최근 10개만 남긴다
  - 받기(pull): 운영·스테이징 EC2 인스턴스 역할만 (IMDSv2 자격 증명만)
  - 올리기(push): 이미지를 만드는 리포의 GitHub Actions 만 (OIDC, 리포·태그별 자기 저장소만)
  비용: VPC 엔드포인트 없이 퍼블릭 엔드포인트 + IAM 으로만 막는다. 같은 리전 ECR→EC2 전송·기본 스캔 무료 → 저장 용량만

# 배포 (1회, 관리자 계정 — CloudShell):
#   aws cloudformation deploy --stack-name dudoong-ecr \
#     --template-file infra/ecr.yml --capabilities CAPABILITY_NAMED_IAM
# dudoong-batch 저장소는 배치 스택(batch.yml)이 이미 만든다 → 여기서는 Backend 푸시 권한만 준다.
# 워크플로는 역할 이름과 리포지토리 secret AWS_ACCOUNT_ID 로 ARN 을 만든다 (Backend·Admin-Front·Front 리포에도 secret 등록 필요).

Parameters:
  InstanceRoleName:
    Type: String
    Default: ec2-docker-log-write-iam
    Description: 운영·스테이징 EC2 인스턴스 역할 이름
  GitHubOrg:
    Type: String
    Default: Gosrock

Mappings:
  # 모든 저장소에 같은 정책
  Lifecycle:
    Policy:
      # 1) 덮어써져 태그가 없어진 이미지(옛 dev)는 7일 뒤 삭제 — 태그 있는 멀티아키 목록이 가리키는 하위 이미지는 지우지 않는다
      # 2) 태그 있는 이미지는 최근 10개만 (롤백 여유)
      Text: >-
        {"rules":[
        {"rulePriority":1,"description":"untagged 7d","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}},
        {"rulePriority":2,"description":"keep last 10","selection":{"tagStatus":"tagged","tagPatternList":["*"],"countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}
        ]}

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !FindInMap [Lifecycle, Policy, Text]

  NginxRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-nginx
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !FindInMap [Lifecycle, Policy, Text]

  # 스테이징은 dev 태그를 계속 덮어쓴다 (Admin-Front·Front 의 dev 브랜치 빌드)
  InternalAdminRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-internal-admin
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: dev
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !FindInMap [Lifecycle, Policy, Text]

  TicketRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-ticket
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: dev
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !FindInMap [Lifecycle, Policy, Text]

  AdminRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: dudoong-admin
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: dev
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !FindInMap [Lifecycle, Policy, Text]

  # 받기: 운영·스테이징 서버 (scripts/ecr-login.sh 가 배포 때 로그인). 저장소 5개 읽기만
  ServerPullPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dudoong-server-ecr-pull
      Description: 운영·스테이징 서버가 ECR 운영 이미지를 받기만
      Roles:
        - !Ref InstanceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # IMDSv2 로 받은 자격 증명만 토큰을 받는다 (server-env-access.yml 과 같은 이유: SSRF 로 새는 IMDSv1 자격 증명 차단)
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
            Condition:
              NumericGreaterThanEquals:
                ec2:RoleDelivery: "2.0"
          - Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource:
              - !GetAtt ApiRepository.Arn
              - !GetAtt NginxRepository.Arn
              - !GetAtt InternalAdminRepository.Arn
              - !GetAtt TicketRepository.Arn
              - !GetAtt AdminRepository.Arn
            # 조건 없음: 실제 pull 은 docker 데몬이 로그인 토큰으로 한다. 토큰 발급(위)에서 IMDSv2 로 막는다

  # 올리기: 리포마다 역할 하나, 자기 저장소에만. 버전 태그 push 와 스테이징 dev 브랜치 job 만 맡는다
  # (버전 태그는 덮어쓸 수 없어 기본 브랜치에서 하는 수동 재빌드는 막는다. 태그 생성은 각 리포 태그 ruleset 으로 관리자만)
  BackendPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-github-ecr-backend
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/DuDoong-Backend:ref:refs/tags/Api-v*
                  - !Sub repo:${GitHubOrg}/DuDoong-Backend:ref:refs/tags/Batch-v*
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !GetAtt ApiRepository.Arn
                  # 배치 스택(batch.yml)이 만든 저장소. Fargate 배치가 쓴다
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/dudoong-batch

  AdminFrontPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-github-ecr-admin-front
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/DuDoong-Admin-Front:ref:refs/tags/AdminFront-v*
                  - !Sub repo:${GitHubOrg}/DuDoong-Admin-Front:ref:refs/heads/dev
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt InternalAdminRepository.Arn

  # Front 는 별도 담당자 리포 (Front #344)
  FrontPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-github-ecr-front
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/DuDoong-Front:ref:refs/tags/Ticket-v*
                  - !Sub repo:${GitHubOrg}/DuDoong-Front:ref:refs/tags/Admin-v*
                  - !Sub repo:${GitHubOrg}/DuDoong-Front:ref:refs/heads/dev
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !GetAtt TicketRepository.Arn
                  - !GetAtt AdminRepository.Arn

  # 이 리포: nginx 빌드(Nginx-v* 태그) + 이미지 복사(DuDoong-Infra 승인 job, Docker Hub → ECR)
  DeployPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-github-ecr-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/DuDoong-Deploy:ref:refs/tags/Nginx-v*
                  - !Sub repo:${GitHubOrg}/DuDoong-Deploy:environment:DuDoong-Infra
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !GetAtt ApiRepository.Arn
                  - !GetAtt NginxRepository.Arn
                  - !GetAtt InternalAdminRepository.Arn
                  - !GetAtt TicketRepository.Arn
                  - !GetAtt AdminRepository.Arn

Outputs:
  ServerPullPolicyArn:
    Value: !Ref ServerPullPolicy
