AWSTemplateFormatVersion: "2010-09-09"
Description: >
  스테이징 서버 켜기/끄기 권한 + 매일 02:00 KST 자동 종료 (WorkBook EP09 3단계).
  내부 어드민(운영 백엔드)이 EC2 인스턴스 역할로 스테이징 1대만 조회·켜기·끄기 할 수 있다.

# 배포 (관리자 계정 — CloudShell). 값은 모두 SSM(/dudoong/infra/*)에서 읽는다 → 파라미터 없이:
#   aws cloudformation deploy --stack-name dudoong-staging-control \
#     --template-file infra/staging-control.yml --capabilities CAPABILITY_NAMED_IAM
# 자동 종료 켜기: SSM /dudoong/infra/staging-auto-stop-state 를 ENABLED 로 바꾼 뒤 같은 명령을 다시 실행.
#   (스테이징을 끄면 퍼블릭 IP 가 바뀌므로, 배포 파이프라인 역할 스택을 먼저 만든 뒤에 켠다)
# 운영 백엔드의 STAGING_INSTANCE_ID 는 운영 .env(SSM /dudoong/env/prod)에 넣는다.

Parameters:
  StagingInstanceId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/staging-instance-id
    Description: 스테이징 EC2 인스턴스 ID (SSM)
  ProdInstanceId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/prod-instance-id
    Description: >
      운영 EC2 인스턴스 ID. 운영·스테이징이 같은 인스턴스 역할을 써서,
      이 서버에서 나온 요청(ec2:SourceInstanceArn)에만 권한을 준다
  InstanceRoleName:
    Type: String
    Default: ec2-docker-log-write-iam
    Description: 운영 EC2 인스턴스 역할 이름 (내부 어드민 백엔드가 쓰는 역할)
  AutoStopCron:
    Type: String
    Default: cron(0 2 * * ? *)
    Description: 자동 종료 시각 (Asia/Seoul)
  AutoStopState:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dudoong/infra/staging-auto-stop-state
    Description: >
      자동 종료 ENABLED/DISABLED (SSM). 스테이징을 끄면 퍼블릭 IP가 바뀌므로,
      배포 파이프라인 역할 스택(github-deploy-role)을 먼저 만든 뒤 ENABLED 로 바꾼다

Resources:
  # 운영 백엔드(인스턴스 역할)에 붙는 권한: 스테이징 1대만 켜기·끄기
  StagingControlPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dudoong-staging-control
      Description: 내부 어드민에서 스테이징 서버 조회·켜기·끄기
      Roles:
        - !Ref InstanceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # 같은 역할을 쓰는 스테이징(인터넷 노출)에서 탈취된 자격 증명으로는 쓰지 못하게 운영 서버 요청만 허용
          # Describe 계열은 리소스 단위로 제한할 수 없다
          - Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"
            Condition:
              ArnEquals:
                ec2:SourceInstanceArn: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProdInstanceId}
              # IMDSv2 로 받은 자격 증명만 (백엔드 AWS SDK v2 는 IMDSv2 를 쓴다)
              NumericGreaterThanEquals:
                ec2:RoleDelivery: "2.0"
          - Effect: Allow
            Action:
              - ec2:StartInstances
              - ec2:StopInstances
            Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${StagingInstanceId}
            Condition:
              ArnEquals:
                ec2:SourceInstanceArn: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProdInstanceId}
              # IMDSv2 로 받은 자격 증명만 (백엔드 AWS SDK v2 는 IMDSv2 를 쓴다)
              NumericGreaterThanEquals:
                ec2:RoleDelivery: "2.0"

  # EventBridge Scheduler 실행 역할: 스테이징 끄기만
  AutoStopRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-staging-auto-stop
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: stop-staging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${StagingInstanceId}

  AutoStopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dudoong-staging-auto-stop
      Description: 깜빡 켜둔 스테이징을 매일 새벽에 끈다
      ScheduleExpression: !Ref AutoStopCron
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow:
        Mode: "OFF"
      State: !Ref AutoStopState
      Target:
        # 이미 꺼져 있으면 StopInstances는 아무 일도 하지 않는다
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt AutoStopRole.Arn
        Input: !Sub '{"InstanceIds":["${StagingInstanceId}"]}'
        RetryPolicy:
          MaximumRetryAttempts: 3

Outputs:
  PolicyArn:
    Value: !Ref StagingControlPolicy
  ScheduleName:
    Value: !Ref AutoStopSchedule
