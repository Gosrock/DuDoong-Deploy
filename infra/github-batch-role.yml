AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DuDoong-Deploy 배치 워크플로용 역할 (WorkBook EP09 4단계, Deploy #25).
  GitHub Actions(DuDoong-Infra Environment)가 batch 이미지 복사, 배치 수동 실행, infra/batch.yml 반영(GitOps)을 한다.

# 배포 (1회, 쓰기 권한 계정으로. github-deploy-role 스택으로 GitHub OIDC 공급자가 이미 있다는 전제):
#   aws cloudformation deploy --stack-name dudoong-github-batch-role \
#     --template-file infra/github-batch-role.yml --capabilities CAPABILITY_NAMED_IAM
# 출력 GitHubRoleArn → GitHub Environment(DuDoong-Infra) 변수 AWS_ROLE_ARN
# 출력 CfnExecutionRoleArn → 같은 Environment 변수 CFN_EXEC_ROLE_ARN

Parameters:
  GitHubRepo:
    Type: String
    Default: Gosrock/DuDoong-Deploy
  GitHubEnvironment:
    Type: String
    Default: DuDoong-Infra

Resources:
  # GitHub Actions 가 맡는 역할: 직접 리소스를 만들지 않고, 스택 반영은 아래 실행 역할에 맡긴다
  GitHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-github-batch
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: batch-ops
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 이미지 복사 (Docker Hub → ECR)
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/dudoong-batch
              # 배치 수동 실행
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/dudoong-batch:*
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/dudoong-batch/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/dudoong-batch-execution
              # infra/batch.yml 반영
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dudoong-batch/*
              - Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn

  # CloudFormation 이 dudoong-batch 스택을 만들 때 쓰는 실행 역할
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dudoong-batch-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-batch-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:*
                  - ecr:*
                  - logs:*
                  - scheduler:*
                  - sns:*
                  - events:*
                  - s3:CreateBucket
                  - s3:PutBucket*
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucket*
                  - s3:GetEncryptionConfiguration
                  - s3:ListBucket
                  - ec2:Describe*
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                Resource: "*"
              # IAM 은 dudoong-batch-* 역할만
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/dudoong-batch-*

Outputs:
  GitHubRoleArn:
    Description: GitHub Environment(DuDoong-Infra) 변수 AWS_ROLE_ARN
    Value: !GetAtt GitHubRole.Arn
  CfnExecutionRoleArn:
    Description: GitHub Environment(DuDoong-Infra) 변수 CFN_EXEC_ROLE_ARN
    Value: !GetAtt CfnExecutionRole.Arn
