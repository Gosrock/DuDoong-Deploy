version: "3.7"
services:
  redis:
    restart: unless-stopped
    image: "redis:alpine"
    network_mode: "host"
    # 서버 안(백엔드 REDIS_HOST=localhost)에서만 붙게 루프백에만 연다 (Deploy #48). ::1 은 IPv6 가 없어도 뜨게 "-" 로 선택 바인드
    command: redis-server --bind 127.0.0.1 -::1 --protected-mode yes
  backend:
    restart: unless-stopped
    image: water0641/dudoong-api:2.3.0
    container_name: backend
    env_file:
      - .env
    network_mode: "host"
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: awslogs
      options:
        awslogs-group: "dudoong-staging"
        awslogs-region: "ap-northeast-2"
        awslogs-stream: "backend"
  front:
    restart: unless-stopped
    image: david0218/dudoong-ticket:dev
    container_name: front
    network_mode: "host"
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: awslogs
      options:
        awslogs-group: "dudoong-staging"
        awslogs-region: "ap-northeast-2"
        awslogs-stream: "front"
  admin:
    restart: unless-stopped
    image: david0218/dudoong-admin:dev
    container_name: admin
    network_mode: "host"
    environment:
      - TZ=Asia/Seoul
  internal-admin:
    restart: unless-stopped
    image: water0641/dudoong-internal-admin:0.6.0
    container_name: internal-admin
    network_mode: "host"
    environment:
      - TZ=Asia/Seoul
  nginx:
    network_mode: "host"
    depends_on:
      - backend
      - front
      - admin
      - internal-admin
    restart: always
    image: water0641/dudoong-nginx:1.9.2
    # HTTPS 인증서 (scripts/tls-cert.sh 가 배포 때·매일 갱신, Deploy #37)
    volumes:
      - /home/ubuntu/tls/certs:/etc/nginx/certs:ro
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: awslogs
      options:
        awslogs-group: "dudoong-staging"
        awslogs-region: "ap-northeast-2"
        awslogs-stream: "nginx"
